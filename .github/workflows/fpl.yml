name: FPL weekly recommendation

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 9 * * 4,5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fpl
  cancel-in-progress: false

defaults:
  run:
    working-directory: fpl-tools

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: fpl-tools/requirements.txt

      - run: pip install -r requirements.txt

      - name: Build recommendation
        run: python run.py

      - name: Commit dashboard and data snapshot
        run: |
          git config user.name  "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add docs data/snapshots out
          git diff --staged --quiet || git commit -m "GW update $(date -u +'%Y-%m-%d %H:%M')"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: fpl-tools/docs

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
